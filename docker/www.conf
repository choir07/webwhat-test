[www]
listen = /var/run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

user = www-data
group = www-data

; Dynamic process manager: spawns/kills workers between min and max based on
; load, rather than a fixed pool (pm = static) or one-per-request (pm = ondemand).
pm = dynamic

; The default Alpine/Debian PHP-FPM image ships with pm.max_children = 5,
; which is why "server reached pm.max_children setting (5)" showed up under
; k6 load at ~20 concurrent VUs — only 5 requests could be served by PHP at
; once, everything past that queued or failed.
;
; These numbers assume a small container (roughly 512MB-1GB available to
; this service). Each worker's real memory use depends on what the request
; does (Filament/admin requests are heavier than a simple product page), so
; treat this as a starting point and watch the Railway memory graph after
; deploying — if it's climbing toward the container's limit under load,
; lower pm.max_children rather than letting it OOM-kill the container.
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10

; Recycle workers periodically to guard against slow memory leaks in
; long-running PHP processes.
pm.max_requests = 500

; Log slow requests (>5s) so you can spot which route is actually slow,
; instead of just seeing generic timeouts.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

; Send PHP-FPM's own error/access output to stdout/stderr so it shows up in
; Railway's log stream (matches how nginx/supervisord are already configured).
catch_workers_output = yes
decorate_workers_output = no