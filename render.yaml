services:
  - type: web
    name: powerful-posts
    env: php
    plan: free
    region: singapore   # closest to Malaysia
    branch: main
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan migrate --force
      php artisan db:seed --class=RolesAndPermissionsSeeder --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Powerful pOSTS"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://powerful-posts.onrender.com
      - key: APP_TIMEZONE
        value: Asia/Kuala_Lumpur
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: powerful-posts-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: powerful-posts-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: powerful-posts-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: powerful-posts-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: powerful-posts-db
          property: password
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: FILAMENT_FILESYSTEM_DISK
        value: public
      - key: CLOUDINARY_URL
        sync: false   # set manually in Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: powerful-posts-db
    databaseName: powerful_posts
    user: powerful_posts_user
    plan: free
    region: singapore